<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start a Project | Iron Digital</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Syne:wght@400..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.34/dist/lenis.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js" defer></script>
    
    <style>
        /* Specific tweaks for the standalone form page */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .standalone-form-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }
        
        /* Converted to Premium Glassmorphism to match the theme */
        .form-box {
            background-color: rgba(17, 34, 64, 0.6); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px); 
            border: 1px solid rgba(0, 212, 255, 0.2); 
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 600px;
            position: relative;
            z-index: 2;
        }
        
        .form-box h2 {
            color: #ffffff;
            margin-top: 0;
            font-size: 2rem;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 30px;
        }
        
        @media (max-width: 768px) {
            .form-box { padding: 30px 20px; }
        }
    </style>
</head>
<body>
    <div class="custom-cursor"></div>

    <nav>
        <a href="index.html" class="logo-wrapper">
            <img src="iron-digital-logo.png" alt="Iron Digital Logo" class="logo-img">
            <div class="logo-text">
                <span>IRON</span> 
                <span style="color: var(--accent-blue); font-weight: 400;">DIGITAL</span>
            </div>
        </a>
        <ul>
            <li><a href="index.html" style="font-weight: bold;">&larr; Back to Home</a></li>
        </ul>
    </nav>

    <div class="standalone-form-container">
        <div class="form-box">
            <h2>Project Request</h2>
            <form class="light-contact-form" action="https://formspree.io/f/xkopgbar" method="POST">
                
                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                
                <div class="form-row" style="margin-bottom: 20px;">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label>Select Your Plan</label>
                    <div class="custom-select-wrapper">
                        <div class="custom-select-trigger">
                            <span>Select an Option...</span>
                            <div class="arrow">▼</div>
                        </div>
                        <div class="custom-options">
                            <span class="custom-option" data-value="starter">Starter Build ($1,000)</span>
                            <span class="custom-option" data-value="standard">Standard Subscription ($99/mo)</span>
                            <span class="custom-option" data-value="growth">Growth Subscription ($199/mo)</span>
                            <span class="custom-option" data-value="premium">Premium Subscription ($399/mo)</span>
                        </div>
                    </div>
                    <input type="hidden" id="project-type" name="project-type" required>
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="business-desc">Business Description & Goals</label>
                    <textarea id="business-desc" name="business-desc" placeholder="Tell us about your business, your target audience, and what you want this website to achieve..." required></textarea>
                </div>
                
                <p style="font-size: 0.85rem; color: var(--text-muted); margin: 0 0 15px 0; font-style: italic; text-align: center;">
                    *Upon submission, we will reach out to schedule your Discovery Call.
                </p>

                <button type="submit" class="submit-btn">Start My Project</button>
            </form>
        </div>
    </div>

    <footer>
        <p style="margin: 0;">&copy; 2026 Iron Digital. | Based in Detroit.</p>
    </footer>

    <script src="main.js"></script>
</body>
</html>
