name: Test Detroit Hub email service
on:
  pull_request:
    paths: ['server/**', '.github/workflows/detroit-hub.yml']
  push:
    paths: ['server/**', '.github/workflows/detroit-hub.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node --check server.js
